name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    name: PHP ${{ matrix.php }} – Laravel ${{ matrix.laravel }} (${{ matrix.stability }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.6']
        laravel: ['12', '13']
        stability: [prefer-lowest, prefer-stable]
        exclude:
          - php: '8.6'
            laravel: '12'
          - php: '8.3'
            laravel: '13'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, intl
          coverage: xdebug

      - name: Set Laravel constraint
        run: composer require "illuminate/cache:^${{ matrix.laravel }}.0" "illuminate/contracts:^${{ matrix.laravel }}.0" "illuminate/support:^${{ matrix.laravel }}.0" --no-update --no-interaction

      - name: Use Pest 4 for Laravel 12
        if: matrix.laravel == '12'
        run: composer require --dev "pestphp/pest:^4.0" "pestphp/pest-plugin-laravel:^4.0" "pestphp/pest-plugin-arch:^4.0" "pestphp/pest-plugin-type-coverage:^4.0" --no-interaction --no-update

      - name: Use Pest 5 for Laravel 13
        if: matrix.laravel == '13'
        run: composer require --dev "pestphp/pest:^5.0" "pestphp/pest-plugin-laravel:^5.0" "pestphp/pest-plugin-arch:^5.0" "pestphp/pest-plugin-type-coverage:^5.0" --no-interaction --no-update

      - name: Install dependencies
        run: composer update --${{ matrix.stability }} --prefer-stable --no-interaction --no-progress

      - name: Run tests
        run: composer test:unit
